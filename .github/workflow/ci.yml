name : "Coovee front end CI"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'
      - name: Install dependencies and run tests
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test